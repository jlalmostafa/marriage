<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل - Syria House</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem 4rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 1.2s ease;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .loader {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-top: 1rem;
        }
        .redirect-note {
            margin-top: 2rem;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بكم في Syria House</h1>
        <p>سيتم تحويلكم إلى الموقع الرسمي بعد 3 ثوانٍ</p>
        <div class="loader"></div>
        <div class="redirect-note" id="counter">جاري التحويل...</div>
    </div>

    <script>
        // عد تنازلي اختياري (اختياري)
        let seconds = 3;
        const counterEl = document.getElementById('counter');
        const interval = setInterval(() => {
            seconds--;
            if (seconds > 0) {
                counterEl.textContent = `التحويل خلال ${seconds} ثانية...`;
            } else {
                clearInterval(interval);
            }
        }, 1000);

        // التحويل بعد 3 ثوانٍ بالضبط
        setTimeout(function() {
            window.location.href = 'https://syriahouse.my';
        }, 3000);
    </script>
</body>
</html>
